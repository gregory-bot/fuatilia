# Builds the static site (browser demo mode, no server) and publishes it to GitHub Pages.
# Live at https://<owner>.github.io/<repo>/ after each push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build (browser demo mode)
        working-directory: frontend
        env:
          VITE_DEMO_MODE: '1'
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build
      # SPA routing on Pages: unknown paths fall back to the app; skip Jekyll processing.
      - run: cp frontend/dist/index.html frontend/dist/404.html && touch frontend/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
